# ═══════════════════════════════════════════════════════════════
# MedAI — Continuous Integration (GitHub Actions)
# Workflow: Lint → Test → Coverage
#
# Deployment is handled automatically by Render when changes
# are pushed to the main branch.
# ═══════════════════════════════════════════════════════════════

name: MedAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ─── Job 1: Lint & Test ──────────────────────────────────────
  test:
    name: Lint & Run Tests
    runs-on: ubuntu-latest

    steps:

      # ─── Checkout ────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── Python ──────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ─── Dependencies ────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      # ─── Code Quality ────────────────────────────────────────
      - name: Lint with flake8
        run: |
          flake8 src/ app.py \
            --max-line-length=120 \
            --ignore=E402,W503,W504,W291,F401,E302,E303,W293,E123,E127,W292,E305,E241,E231

      # ─── Unit Tests ──────────────────────────────────────────
      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --tb=short
        env:
          PINECONE_API_KEY: "test-key"
          FLASK_SECRET_KEY: "test-secret"
          LLM_PROVIDER: "mock"

      # ─── Coverage ────────────────────────────────────────────
      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false